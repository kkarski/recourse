<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{TITLE}}</title>
  <link rel="stylesheet" href="/__spectr__/chrome.css" />
  <script src="/__spectr__/chrome.js" defer></script>
</head>
<body class="spectr-chrome">
  <header class="spectr-chrome-bar">
    <span class="spectr-chrome-brand">Spectr</span>
    <span class="spectr-chrome-label">{{LABEL}}</span>
  </header>
  <main class="spectr-chrome-main">
    <iframe class="spectr-spec-frame" title="Specification" src="{{IFRAME_SRC}}"></iframe>
  </main>
</body>
</html>
