# Mirrors [project] in pyproject.toml — keeps legacy pip/setuptools builds from
# producing UNKNOWN-0.0.0 wheels when PEP 621 metadata is not applied.
# Bump version here and in pyproject.toml / spectr/__init__.py together.

[metadata]
name = spectr
version = 0.1.1
description = CLI for spec-driven software specifications (use cases, ACs, tests, Q&A)

[options]
package_dir =
    =src
packages = find:
python_requires = >=3.10
install_requires =
    click>=8.1
    lxml>=5.0

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    spectr = spectr.cli:main
